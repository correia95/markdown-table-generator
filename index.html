      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I make a table in Markdown?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Write the header cells separated by pipe characters, then a divider row of dashes, then each body row. Alignment goes on the divider: :--- for left, :---: for centre, ---: for right. This tool builds all of that from a grid you fill in."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert a CSV to a Markdown table?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Open the import box, paste the CSV (or TSV, or an existing Markdown table) and load it into the grid, then switch the output format to Markdown and copy."
            }
          },
          {
            "@type": "Question",
            "name": "What is the compact Markdown option?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Normal output pads every column so the raw Markdown lines up and is easy to read in a diff. Compact output uses single spaces, which is shorter but harder to read as source."
            }
          },
          {
            "@type": "Question",
            "name": "Is my table sent anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It is built and formatted in your browser and saved only in local storage. The page works offline once loaded."
            }
          }
        ]
      }
